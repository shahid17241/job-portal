{% extends "jobs/job_list.html" %}

{% block content %}
<h1>Delete {{ object.title }}</h1>
<form method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete this job?</p>
    <button type="submit">Delete</button>
    <a href="{% url 'my_job_list' %}">Cancel</a>
</form>
{% endblock %}
