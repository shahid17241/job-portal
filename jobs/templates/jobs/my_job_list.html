{% extends "jobs/job_list.html" %}

{% block content %}
<div class="container py-4 py-md-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 mb-md-5">
        <div>
            <p class="text-uppercase text-primary fw-semibold small mb-2">Employer dashboard</p>
            <h1 class="display-6 fw-bold mb-0">My Jobs</h1>
        </div>
    </div>

    <div class="row g-4">
        {% for job in my_jobs %}
            <div class="col-12 col-md-6 col-xl-4">
                <article class="card h-100 border-0 shadow-sm rounded-4">
                    <div class="card-body d-flex flex-column p-4">
                        <h2 class="h4 mb-4">
                            <a class="text-dark text-decoration-none" href="{% url 'job_detail' job.pk %}">{{ job.title }}</a>
                        </h2>
                        <div class="mt-auto d-flex flex-wrap gap-2">
                            <a class="btn btn-outline-secondary" href="{% url 'job_update' job.pk %}">Edit</a>
                            <a class="btn btn-outline-danger" href="{% url 'job_delete' job.pk %}">Delete</a>
                        </div>
                    </div>
                </article>
            </div>
        {% empty %}
            <div class="col-12">
                <div class="alert alert-light border shadow-sm rounded-4 text-center p-4 p-md-5 mb-0" role="status">
                    <h2 class="h4 mb-2">No jobs posted yet</h2>
                    <p class="text-muted mb-0">You have not posted any jobs.</p>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
